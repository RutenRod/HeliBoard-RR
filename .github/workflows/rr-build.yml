name: RR keyboards

# Builds RØR, the own keyboard with Polish and English.
# To be able to install a new build over an older one (keeping settings and learned words), all builds
# need to be signed with the same key: add a repository secret RR_KEYSTORE_BASE64 containing a
# base64-encoded debug keystore. Without the secret every build gets a new key and the old app
# must be uninstalled first.

on:
  push:
    branches: [ 'main', 'etap-**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Use the signing key from the repository secret
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RR_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$RR_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "using the signing key from RR_KEYSTORE_BASE64"
          else
            echo "::warning::RR_KEYSTORE_BASE64 is not set, this build is signed with a new key and can't be installed over an older build"
          fi

      - name: Prepare variant
        run: rr/apply-variant.sh pl,en

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew assembleDebug -PrrLanguages=pl,en

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROR
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
